name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Bundle the fonts
        run: |
          mkdir -p app/src/main/assets/fonts
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL -o app/src/main/assets/fonts/BricolageGrotesque.ttf "$base/bricolagegrotesque/BricolageGrotesque%5Bopsz,wdth,wght%5D.ttf" || echo "::warning::Heading font not downloaded; the app will use the phone's font"
          curl -fsSL -o app/src/main/assets/fonts/AtkinsonHyperlegible-Regular.ttf "$base/atkinsonhyperlegible/AtkinsonHyperlegible-Regular.ttf" || echo "::warning::Body font not downloaded"
          curl -fsSL -o app/src/main/assets/fonts/AtkinsonHyperlegible-Bold.ttf "$base/atkinsonhyperlegible/AtkinsonHyperlegible-Bold.ttf" || echo "::warning::Bold body font not downloaded"

      - name: Restore upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "::notice::SIGNING: Google Play upload key found"
          else
            echo "::notice::SIGNING: test key (for installing on your own phone only)"
          fi

      - name: Build the app
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build.log || {
            # Post the error as an annotation so it can be read without opening the full log
            awk '/What went wrong/{f=1} f' build.log | head -25 | tr '\n' ' ' | sed 's/^/::error title=Gradle::/'; echo
            grep -E "^e: |error:" build.log | head -8 | while read -r l; do echo "::error title=Compile::$l"; done
            exit 1; }

      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk comity.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build comity.apk --prerelease --target "$GITHUB_SHA" \
            --title "Comity test build ${{ github.run_number }}" \
            --notes "Tap comity.apk below to download, then open it to install. Test build for your own phone."
          echo "::notice title=Download::https://github.com/${{ github.repository }}/releases/download/test-build/comity.apk"
